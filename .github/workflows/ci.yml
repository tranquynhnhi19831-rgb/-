name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Smoke import both API applications
        env:
          PYTHONPATH: backend
        run: python -c "import main, public_main; print('api imports ok')"
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-ops:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($_.FullName):" -ForegroundColor Red
              $parseErrors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell scripts parse cleanly on Windows PowerShell 5.1."

  s6-acceptance:
    needs: backend
    if: contains(github.ref, 'jianghe-s6-5-acceptance') || contains(github.head_ref, 'jianghe-s6-5-acceptance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Binance Data Vision acceptance
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p artifacts
          python scripts/s6_acceptance.py \
            --symbol BTC/USDT \
            --start 2026-08-01T00:00:00Z \
            --end 2026-08-01T06:00:00Z \
            --output artifacts/s6_acceptance.json
      - name: Upload S6 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-acceptance-report
          path: artifacts/s6_acceptance.json
          if-no-files-found: error

  research-btc-year:
    if: github.head_ref == 'codex/research-btc-2020-now' || github.ref == 'refs/heads/codex/research-btc-2020-now'
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Patch temporary month iterator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_btc_2020_now.py')
          text = path.read_text()
          text = text.replace(
              '        cur = (cur + pd.offsets.MonthBegin(1)).to_pydatetime()\n        cur = pd.Timestamp(cur, tz="UTC")',
              '        cur = cur + pd.offsets.MonthBegin(1)',
          )
          path.write_text(text)
          PY
      - name: Run BTC Jianghe long-range research slice
        env:
          PYTHONPATH: backend
        run: python scripts/research_btc_2020_now.py --year ${{ matrix.year }}
