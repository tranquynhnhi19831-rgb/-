name: research-jianghe-v6-5m-execution

on:
  pull_request:
    branches: ["codex/jianghe-v5-scored-economics"]
  workflow_dispatch:

concurrency:
  group: research-jianghe-v6-5m-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-timeframe-window:
    if: github.head_ref == 'codex/jianghe-v6-5m-execution'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2023-Q1
            start: 2023-01-01T00:00:00Z
            end: 2023-04-01T00:00:00Z
          - label: 2024-Q1
            start: 2024-01-01T00:00:00Z
            end: 2024-04-01T00:00:00Z
          - label: 2026-Q1
            start: 2026-01-01T00:00:00Z
            end: 2026-04-01T00:00:00Z
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Compare V5 1m vs V6 5m on ${{ matrix.label }}
        env:
          PYTHONPATH: backend
        run: >-
          python scripts/research_jianghe_v6_5m_execution.py
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
