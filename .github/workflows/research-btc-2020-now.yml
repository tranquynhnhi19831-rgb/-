name: research-btc-2020-now

on:
  push:
    branches: ["codex/research-btc-2020-now"]
  pull_request:
    branches: ["codex/jianghe-s7-paper-engine"]
  workflow_dispatch:

jobs:
  btc-year:
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Patch temporary month iterator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_btc_2020_now.py')
          text = path.read_text()
          text = text.replace(
              '        cur = (cur + pd.offsets.MonthBegin(1)).to_pydatetime()\n        cur = pd.Timestamp(cur, tz="UTC")',
              '        cur = cur + pd.offsets.MonthBegin(1)',
          )
          path.write_text(text)
          PY
      - name: Run BTC Jianghe long-range research slice
        env:
          PYTHONPATH: backend
        run: python scripts/research_btc_2020_now.py --year ${{ matrix.year }}
