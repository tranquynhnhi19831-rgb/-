name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Smoke import both API applications
        env:
          PYTHONPATH: backend
        run: python -c "import main, public_main; print('api imports ok')"
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  s6-acceptance:
    needs: backend
    if: contains(github.ref, 'jianghe-s6-5-acceptance') || contains(github.head_ref, 'jianghe-s6-5-acceptance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Binance Data Vision acceptance
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p artifacts
          python scripts/s6_acceptance.py \
            --symbol BTC/USDT \
            --start 2026-08-01T00:00:00Z \
            --end 2026-08-01T06:00:00Z \
            --output artifacts/s6_acceptance.json
      - name: Upload S6 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-acceptance-report
          path: artifacts/s6_acceptance.json
          if-no-files-found: error
